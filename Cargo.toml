[package]
name = "jobscout"
version = "0.1.26"
edition = "2021"
description = "Desktop job-post scout: LinkedIn search, job details and profile matching"

[dependencies]
dioxus = { version = "=0.7.10", features = ["desktop"] }
# What every mayorana desktop app shares: statistics, update check, notice and
# licence. Beside this repository; CI checks it out there at a pinned tag.
desktop-kit = { path = "../desktop-kit", features = ["ui"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rfd = "0.15"
notify-rust = "4"
# The Copy button: the webview's clipboard API needs a secure origin and a
# user-gesture check that differ per platform; the native clipboard does not.
arboard = "3"
# Basic auth and Arbeitsagentur's job references.
base64 = "0.22"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
# The built-in browser backend (src/services/webkit.rs): the same WebKit the
# window renders in, already linked through wry, so nothing extra ships.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSGeometry"] }
objc2-web-kit = { version = "0.3", features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigation"] }

[lints.clippy]
# The same lints in every desktop app. A panic is a crash the user sees, so unwrap and expect
# are refused outside tests, as is unsafe code without a SAFETY comment. Where one is right
# (a constant that cannot fail), allow it on that item and say why.
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
