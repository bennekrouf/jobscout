<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Data Scientist Sensors","description":"Around 3000 employees of RUAG and RUAG Real Estate make a significant contribution every day to the security of Switzerland. They ensure that the Swiss Army as well as other operational and security organisations can fully perform their tasks at any time.\u003ch1>Data Scientist Sensors\u003c/h1>\u003cp>80-100%\u003c/p>\u003cp>Wangen\u003c/p>\u003cp>\u003cb>\u003cb>What you can achieve\u003c/b>\u003c/b>\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>Support the further development of our modelling and analysis software ecosystem through collaborative development, documentation, and adherence to best engineering practices\u003c/li>\u003cli>Analyse measurement and test data from practice, derive performance indicators, and create technical documentation and reports for internal use and for customers\u003c/li>\u003cli>Develop and apply machine learning methods to extract meaningful patterns and insights from radar datasets\u003c/li>\u003cli>Contribute to the investigation of technical incidents and data anomalies to ensure system reliability and smooth operation\u003c/li>\u003cli>Work effectively in highly regulated, air-gapped environments while complying with strict security and quality standards\u003c/li>\u003c/ul>\u003cp>\u003cb>\u003cb>What you bring\u003c/b>\u003c/b>\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>Master's degree or PhD in Computational Science, Computer Science, Physics, Applied Mathematics, or a closely related field\u003c/li>\u003cli>Strong expertise in Python for scientific computing and data analysis, with solid experience in relevant libraries such as NumPy, Pandas, Matplotlib\u003c/li>\u003cli>Expert in mathematical and numerical modelling of complex, dynamic systems, including handling noisy and high-dimensional data\u003c/li>\u003cli>Practical knowledge of machine learning frameworks (TensorFlow, PyTorch)\u003c/li>\u003cli>Good familiarity with the Linux ecosystem and initial experience with compiled languages (e.g. C, C++, Rust)\u003c/li>\u003cli>Proven ability to quickly and independently acquire domain-specific knowledge and translate scientific principles into practical engineering solutions\u003c/li>\u003cli>Ability to find a healthy balance between intellectual curiosity and the demands of customers and the company\u003c/li>\u003cli>Enthusiasm for deep immersion in the world of radar data processing\u003c/li>\u003cli>Language skills: German at least C1, English at least C1, French is a big plus\u003c/li>\u003cli>Swiss citizenship is required\u003c/li>\u003c/ul>\u003cp>Do you not meet all the requirements one hundred percent? Apply anyway. We are always looking for talented and motivated people who want to enrich our team. We place great value on diversity and equal opportunities and our goal is to build a diverse team where everyone can fully develop their personal strengths. We especially encourage all people, regardless of gender, who may have concerns about accepting a position in a military-related environment, to apply.\u003c/p>\u003cp>\u003cb>About the department\u003c/b>\u003c/p>\u003cp>In times of increasing geopolitical tensions and uncertainties, a country's ability to ensure its security and sovereignty is of utmost importance. Our mission in the Engineering Sensors &amp; Electronic Warfare department at RUAG is to support the Swiss Army in its tasks by enabling persistent situational awareness.\u003cbr>\u003cbr>A key part of this mission is to provide reliable and robust surveillance and analysis capabilities for military air surveillance radars. For this, we design and develop customised software tools for processing, analysing, and visualising the data recorded by these systems.\u003cbr>\u003cbr>Our work requires a deep mathematical and physical understanding of the entire signal processing chain – from raw signal acquisition through processing to interpretation.\u003cbr>\u003cbr>To support our radar engineering team, we are looking for an experienced computational/data scientist who brings a rigorous approach.\u003c/p>\u003cp>\u003cb>Your benefits\u003c/b>\u003c/p>\u003cp>\u003cb>\u003cb>Salary and benefits\u003c/b>\u003c/b>\u003c/p>\u003cp>We place great importance on our employees finding a healthy balance between work and private life. Therefore, among other things, we offer flexible working hours and home office options.\u003c/p>\u003cp>We offer you a performance-oriented and market-appropriate salary, 13 monthly salaries as well as generous bonuses and allowances. Together with other benefits, this results in an attractive overall package.\u003c/p>\u003cp>\u003cb>\u003cb>Flexible working\u003c/b>\u003c/b>\u003c/p>\u003cp>\u003cb>\u003cb>Discounts\u003c/b>\u003c/b>\u003c/p>\u003cp>At RUAG, you benefit from discounts in the areas of mobility and catering. In addition, you benefit from attractive offers on our benefit portal and have fleet discounts with various renowned car brands.\u003c/p>\u003cp>\u003cb>\u003cb>Advancement and training opportunities\u003c/b>\u003c/b>\u003c/p>\u003cp>It is important to us to promote and develop the potential of our employees. Through training, courses, and further education, we support them in continuously expanding their skills to achieve their professional goals.\u003c/p>\u003cp>\u003cb>\u003cb>Leisure activities\u003c/b>\u003c/b>\u003c/p>\u003cp>Our employees are close to our hearts. That is why we give them a day off on their birthday, offer a diverse sports programme, and the possibility to take additional days off with salary deduction in addition to the annual holiday entitlement.\u003c/p>\u003cp>\u003cb>\u003cb>Your contact person\u003c/b>\u003c/b>\u003c/p>\u003cp>Stefanie Pascarella\u003c/p>\u003cp>Talent Acquisition Specialist\u003c/p>\u003cp>+41 58 461 75 62\u003c/p>","disambiguatingDescription":"Software Engineer","identifier":{"@type":"PropertyValue","name":"Job ID","value":"0a5885a1-e898-4268-a7e5-f8afa1499744"},"url":"https://www.jobs.ch/en/vacancies/detail/0a5885a1-e898-4268-a7e5-f8afa1499744/","mainEntityOfPage":"https://www.jobs.ch/en/vacancies/detail/0a5885a1-e898-4268-a7e5-f8afa1499744/","image":"https://media.jobs.ch/images/18afccf5-4a5c-4efe-ae6a-d3bd7d3dfa9f","datePosted":"2026-10-14T05:02:22+02:00","jobImmediateStart":false,"jobStartDate":"2026-11-13T03:02:22.000Z","totalJobOpenings":128,"hiringOrganization":{"@type":"Organization","name":"RUAG AG","sameAs":"https://www.ruag.ch/","logo":"https://media.jobs.ch/images/8551d4f5-6c72-4a41-ad57-96a3b5a2319a/profile-400x400.png"},"employerOverview":"We make a significant contribution to sovereign security for Switzerland. As a holistic security company and future-oriented technology partner of the Swiss Armed Forces, life-cycle management, operations and the availability of military systems are a priority for us. Our business areas include military systems for air and land as well as communication, command and control & reconnaissance systems. In addition, we offer a wide range of services in the fields of aerodynamics, testing and ICT consulting. All of these business activities are therefore strongly geared toward strengthening Swiss sovereign security.","employmentType":"Permanent position","workHours":"33.6 - 42 hours/week","employmentUnit":{"@type":"Organization","name":"Employee"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"","addressRegion":"Wangen","postalCode":"8602","addressCountry":"CH"}},"applicantLocationRequirements":{"@type":"Country","name":"Switzerland"},"industry":"Industry various","occupationalCategory":{"@type":"CategoryCode","codeValue":"98","name":"Technical / Information Technology / Telecom. / Software Architecture / Engineering"},"baseSalary":{"@type":"MonetaryAmount","currency":"CHF","value":{"@type":"QuantitativeValue","minValue":77062.69866071429,"maxValue":117062.69866071429,"unitText":"YEAR"}},"jobBenefits":[],"skills":[],"additionalType":"https://schema.org/Product","sameAs":"https://www.jobs.ch/en/companies/104976-ruag-ag/","subjectOf":[{"@type":"VideoObject","name":"erklärvideo_h264_4k_de_v1 (2160p)_Verkleinert (1)","contentUrl":"https://player.vimeo.com/video/1189707389","description":"erklärvideo_h264_4k_de_v1 (2160p)_Verkleinert (1)","thumbnailUrl":"https://i.vimeocdn.com/video/2154285673-8fba6b2a32ccc18d1050470943be4be8d3ce5bb369e18fbfd72112a3d30dbd2f-d_295x166?region=us","uploadDate":"2026-10-14T05:02:22+02:00"},{"@type":"VideoObject","name":"RUAG Markenfilm (1)","contentUrl":"https://player.vimeo.com/video/1189705632","description":"RUAG Markenfilm (1)","thumbnailUrl":"https://i.vimeocdn.com/video/2154283131-1f274f4341f80bf71b78439ee4ec8c96663807d4b1df19e658427260eb64b88a-d_295x166?region=us","uploadDate":"2026-10-14T05:02:22+02:00"}]}</script>
